
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GOAT Code Editor — Real-time Collaborative IDE</title>
    <meta name="description" content="GOAT Code Editor is a real-time collaborative IDE with Monaco editor, AI assistance, live cursors, and multi-language execution. Built with React, Socket.io, and Node.js." />
    <meta name="keywords" content="code editor, collaborative, monaco, real-time, AI, socket.io, react" />
    <meta name="author" content="Tharunkumar & Pratap — Team GOAT" />
    <meta property="og:title" content="GOAT Code Editor" />
    <meta property="og:description" content="Real-time collaborative code editor with AI assistance and live execution." />
    <meta property="og:image" content="https://i.postimg.cc/s2ckXQk6/LOGO-FINAL.png" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" href="https://i.postimg.cc/s2ckXQk6/LOGO-FINAL.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #f0f4ff;
        font-family: 'Inter', sans-serif;
      }
      .monaco-editor {
        padding-top: 8px;
      }

      /*
       * CURSOR-SYNC FIX: Neutralise any Tailwind CDN or global CSS resets that
       * could affect Monaco's internal character-width measurement spans.
       * Monaco maps pixel-X positions to model columns using measured char widths.
       * Any non-zero letter-spacing or unexpected font override on these spans
       * will make that mapping wrong, causing clicks to register at wrong columns.
       */
      .monaco-editor .view-lines,
      .monaco-editor .view-lines *,
      .monaco-editor .mtk1,
      .monaco-editor .mtk2,
      .monaco-editor .mtk3,
      .monaco-editor .mtk4,
      .monaco-editor .mtk5,
      .monaco-editor .mtk6,
      .monaco-editor .view-line span {
        letter-spacing: 0 !important;
        font-variant-ligatures: none !important;
      }

      /* Global scrollbar — dark for editor, transparent for light pages */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #c7d2fe;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #818cf8;
      }

      /* Dark scrollbar inside editor panel */
      .editor-dark ::-webkit-scrollbar-track { background: #0d1117; }
      .editor-dark ::-webkit-scrollbar-thumb { background: #333; }
      .editor-dark ::-webkit-scrollbar-thumb:hover { background: #444; }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }

      /* Typing Dots Animation */
      .typing-dot {
        width: 3px;
        height: 3px;
        background: currentColor;
        border-radius: 50%;
        display: inline-block;
        animation: typing-dots 1.4s infinite ease-in-out both;
      }
      .typing-dot:nth-child(1) { animation-delay: -0.32s; }
      .typing-dot:nth-child(2) { animation-delay: -0.16s; }

      @keyframes typing-dots {
        0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
